[project]
name = "clean-air-companion"
version = "1.0.0"
description = "Personalised air-quality guidance for households"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "pydantic>=2.9.2",
    "httpx>=0.27.2",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length handled flexibly for long advisory strings
    "RUF001",  # ambiguous characters in strings
    "RUF002",  # ambiguous characters in docstrings
    "RUF003",  # ambiguous characters in comments
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85"

